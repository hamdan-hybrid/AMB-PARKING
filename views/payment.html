<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Pembayaran Parkir</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
/* Halaman pembayaran parkir publik: dibuka dari QR tiket masuk ({payment link}/payment/{no tiket}). */
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:linear-gradient(180deg,#f3f5fb 0,#eef1f8 100%);color:#1b1d33;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:min(440px,100%);margin:0 auto;padding:16px 16px 28px}
.card{overflow:hidden;border:1px solid #e6e8f0;border-radius:20px;background:#fff;box-shadow:0 14px 40px rgba(30,30,70,.08)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid #eceef5}
.head .q{height:28px}.head .g{height:38px}
.merchant{padding:18px 20px 4px;text-align:center}
.merchant h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px}
.merchant p{margin:2px 0 0;color:#8d8fa3;font-size:12.5px}
.total{display:grid;justify-items:center;gap:2px;margin:14px 20px 4px;padding:16px;border-radius:16px;background:#f6f7fb}
.total small{color:#8d8fa3;font-size:11px;font-weight:700;letter-spacing:1px}
.total b{font-size:34px;font-weight:900;letter-spacing:-.8px}
.total span{color:#8d8fa3;font-size:12px}
.info{display:grid;gap:0;margin:10px 20px 0;padding:0}
.info>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #e6e8f0;font-size:13.5px}
.info>div:last-child{border-bottom:0}
.info dt{color:#8d8fa3}.info dd{margin:0;font-weight:700;text-align:right}
.plate{display:inline-block;padding:1px 8px;border-radius:6px;background:#1b1d33;color:#fff;font-weight:800;letter-spacing:1px}
.info .foto{display:grid;gap:8px}
.info .foto dd{font-weight:400;text-align:left}
.slide{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border:1px solid #e6e8f0;border-radius:12px;background:#f1f2f8}
.slide::-webkit-scrollbar{display:none}
.slide a{position:relative;flex:0 0 100%;aspect-ratio:16/9;scroll-snap-align:center}
.slide img{display:block;width:100%;height:100%;object-fit:cover}
.slide .badge{position:absolute;top:8px;right:8px;padding:2px 8px;border-radius:999px;background:rgba(27,29,51,.72);color:#fff;font-size:11.5px;font-weight:700}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots button{width:7px;height:7px;padding:0;border:0;border-radius:4px;background:#d3d6e2;cursor:pointer;transition:width .2s,background .2s}
.dots button.on{width:18px;background:#e2231a}
.act{padding:16px 20px 20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:0;border-radius:14px;font:inherit;font-weight:800;font-size:15.5px;cursor:pointer;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,#e2231a,#f04b3c);color:#fff;box-shadow:0 8px 20px rgba(226,35,26,.25)}
.btn-primary:disabled{opacity:.6;cursor:wait}
.btn-ghost{margin-top:10px;border:1.5px solid #d9dbe6;background:#fff;color:#4b4f6b}
.qr{display:grid;justify-items:center;gap:12px;padding:6px 20px 0}
.qr-box{display:grid;place-items:center;width:min(280px,78vw);aspect-ratio:1;padding:10px;border:1px solid #e6e8f0;border-radius:16px;background:#fff;box-shadow:0 6px 24px rgba(30,30,70,.10)}
.qr-box img{width:100%;height:100%;image-rendering:pixelated}
.st{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#f1f2f8;color:#4b4f6b;font-size:13px;font-weight:800}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:#f0a020;animation:pulse 1.2s ease-in-out infinite}
.st.err{background:#fdeceb;color:#d4141c}.st.err::before{background:#d4141c;animation:none}
@keyframes pulse{50%{opacity:.25}}
.hint{margin:0;color:#8d8fa3;font-size:12px;text-align:center}
.done{display:grid;justify-items:center;gap:10px;padding:26px 22px 8px;text-align:center}
.done .ic{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#e5f6ef;color:#0b7a62}
.done h2{margin:0;font-size:20px}
.done p{margin:0;color:#6b6f88;font-size:14px}
.msg{padding:34px 22px;text-align:center;color:#6b6f88}
.msg h2{margin:0 0 6px;color:#1b1d33;font-size:18px}
.spin{width:34px;height:34px;margin:0 auto 12px;border:4px solid #e3e5ef;border-top-color:#e2231a;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{padding:12px 14px;border-radius:12px;background:#fff7e6;color:#8a5a00;font-size:13px;text-align:center}
.foot{margin-top:14px;color:#a3a6b8;font-size:11.5px;text-align:center}
/* SweetAlert (dimuat saat ada peringatan): sudut bulat seperti kartu halaman ini. */
.swal2-popup{width:min(360px,calc(100vw - 32px));border-radius:20px}
.swal2-title{color:#1b1d33;font-size:21px}
.swal2-html-container{color:#6b6f88;font-size:14.5px}
.swal2-styled.swal2-confirm{min-width:140px;border-radius:12px;font-weight:800}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="head"><img class="q" src="/assets/qris-logo.png" alt="QRIS"><img class="g" src="/assets/gpn-logo.svg" alt="GPN"></div>
    <div id="view"><div class="msg"><div class="spin"></div>Memuat data tiket...</div></div>
  </section>
  <p class="foot">Pembayaran parkir dengan QRIS · AMB Parking</p>
</main>
